name: API Compatibility Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"  # Monday 7am UTC
  workflow_dispatch:

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build check
        run: go build ./cmd/server

      - name: API compat tests (Lidarr + SpotiFLAC upstream match)
        run: go test -tags apicompat -v ./tests/apicompat/

      - name: Validate OpenAPI spec
        run: python3 scripts/validate-openapi.py
