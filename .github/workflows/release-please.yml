name: Release Please

on:
  push:
    branches: [main]
  # Manual re-run, for when a release PR needs regenerating without a new
  # commit - e.g. after fixing the repo setting that lets Actions open PRs.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens/updates a release PR that collects every Conventional Commit
      # since the last release, writes CHANGELOG.md and bumps version.txt.
      # Merging that PR is what creates the vX.Y.Z tag - which is the trigger
      # release.yml already listens on, so the container build is unchanged.
      #
      # Pre-1.0 on purpose: bump-minor-pre-major keeps a breaking change at
      # 0.x.0 instead of jumping to 1.0.0, and bump-patch-for-minor-pre-major
      # keeps a feature at 0.0.x. The version says "not API-stable yet",
      # which is true - the SABnzbd surface is shaped by what Lidarr happens
      # to call.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  # A tag pushed by GITHUB_TOKEN does NOT trigger other workflows - GitHub
  # suppresses it to stop workflows setting each other off in a loop. So
  # merging the release PR created v0.0.2 and built no container at all, and
  # the tag had to be dispatched by hand. Calling the release workflow
  # directly is the fix that needs no PAT: a reusable-workflow call runs
  # inside THIS run, so the suppression does not apply.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
      packages: write
    secrets: inherit
